<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Judicial</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
  <div>
    <h1>Calculadora de Atualização Judicial</h1>
    <div class="muted">Processo → Verbas → Parâmetros → Resultado | <span id="dbinfo"></span></div>
  </div>
  <a href="/tabelas" style="margin-top:0"><button class="sec" style="margin-top:0">Atualizar tabelas</button></a>
</div>
<div class="stepper"><div class="on"></div><div class="on"></div><div id="s3"></div><div id="s4"></div></div>

<div class="card">
<label>Nº processo</label><input id="proc" value="0001234-56.2020.8.26.0100">
<div class="row">
<div><label>Preset / Tribunal</label><select id="preset"></select></div>
<div><label>Data final (AAAA-MM-DD)</label><input id="dfim" value="2026-10-07"></div>
</div>
<div class="row">
<div><label>Honorários %</label><input id="hon" value="10" type="number"></div>
<div><label>Custas R$</label><input id="custas" value="0" type="number"></div>
<div><label>Multa R$</label><input id="multa" value="0" type="number"></div>
</div>
</div>

<div class="card">
<h3>Verbas</h3>
<div id="verbas"></div>
<button class="sec" onclick="addVerba()">+ Adicionar verba</button>
</div>

<button onclick="calcular()">Calcular 🧮</button>
<div id="erro"></div>
<div class="card" id="res" style="display:none">
<h3>Resultado</h3>
<table><thead><tr><th>Verba</th><th>Corrigido</th><th>Juros</th><th>Total</th></tr></thead><tbody id="tbody"></tbody></table>
<div class="total"><span id="tlabel">TOTAL</span><span id="ttotal"></span></div>
<div class="row" style="margin-top:12px">
<div><button class="sec" style="width:100%" onclick="memoriaPDF()">📄 Memória PDF</button></div>
<div><button class="sec" style="width:100%" onclick="exportCSV()">📊 Excel mês-a-mês (CSV)</button></div>
<div><button style="width:100%" onclick="novaSimulacao()">Nova simulação</button></div>
</div>
<div class="muted" style="margin-top:8px">Memória: V_corr = V0 × (índice1/índice0) | Juros simples pro-rata die | Honorários sobre condenação</div>
</div>

<script>
let lastResult = null;
async function presets(){
  const r = await fetch('/api/presets').then(r=>r.json());
  const s = document.getElementById('preset');
  s.innerHTML = Object.entries(r).map(([k,v])=>`<option value="${k}">${k} — ${v.descricao}</option>`).join('');
}
function addVerba(nome='Dano moral', valor=20000, base='2023-06-15'){
  const d = document.createElement('div'); d.className='verba';
  d.innerHTML = `<label>Nome</label><input class="vn" value="${nome}">
  <div class="row"><div><label>Valor base</label><input class="vv" type="number" value="${valor}"></div>
  <div><label>Data base</label><input class="vb" value="${base}"></div></div>
  <button class="sec" onclick="this.parentElement.remove()">Remover</button>`;
  document.getElementById('verbas').appendChild(d);
}
async function calcular(){
  document.getElementById('erro').textContent='';
  const verbas=[...document.querySelectorAll('.verba')].map(e=>({
    nome:e.querySelector('.vn').value, valor_base:parseFloat(e.querySelector('.vv').value),
    data_base:e.querySelector('.vb').value, juros_ini:e.querySelector('.vb').value}));
  if(!verbas.length){document.getElementById('erro').textContent='Adicione 1 verba.';return;}
  const body={processo:document.getElementById('proc').value, preset:document.getElementById('preset').value,
    data_fim:document.getElementById('dfim').value, honorarios_perc:parseFloat(document.getElementById('hon').value||0),
    custas:parseFloat(document.getElementById('custas').value||0),
    multa:parseFloat(document.getElementById('multa').value||0), verbas};
  const r = await fetch('/api/calcular',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
  if(r.erro){document.getElementById('erro').textContent='ERRO: '+r.erro;return;}
  lastResult = {req: body, res: r};
  document.getElementById('res').style.display='block';
  document.getElementById('s3').className='on'; document.getElementById('s4').className='on';
  document.getElementById('tbody').innerHTML=r.verbas.map(v=>`<tr><td>${v.nome}</td><td>R$ ${v.corrigido.toFixed(2)}</td><td>R$ ${v.juros.toFixed(2)}</td><td><b>R$ ${v.total.toFixed(2)}</b></td></tr>`).join('')
    + `<tr><td colspan="3">Honorários</td><td>R$ ${r.honorarios.toFixed(2)}</td></tr>`
    + `<tr><td colspan="3">Custas</td><td>R$ ${(r.custas||0).toFixed(2)}</td></tr>`
    + `<tr><td colspan="3">Multa</td><td>R$ ${(r.multa||0).toFixed(2)}</td></tr>`;
  document.getElementById('ttotal').textContent=`R$ ${r.total.toFixed(2)} (id ${r.id})`;
}
function memoriaPDF(){
  if(!lastResult){return;}
  const {req, res} = lastResult;
  const w = window.open('', '_blank');
  const rows = res.verbas.map(v=>`<tr><td>${v.nome}</td><td>R$ ${v.corrigido.toFixed(2)}</td><td>R$ ${v.juros.toFixed(2)}</td><td><b>R$ ${v.total.toFixed(2)}</b></td></tr>`).join('')
    + `<tr><td colspan="3">Subtotal condenação</td><td><b>R$ ${res.base.toFixed(2)}</b></td></tr>`
    + `<tr><td colspan="3">Honorários</td><td>R$ ${res.honorarios.toFixed(2)}</td></tr>`
    + `<tr><td colspan="3">Custas</td><td>R$ ${(res.custas||0).toFixed(2)}</td></tr>`
    + `<tr><td colspan="3">Multa</td><td>R$ ${(res.multa||0).toFixed(2)}</td></tr>`;
  w.document.write(`<html><head><meta charset="utf-8"><title>Memória - ${req.processo}</title><style>body{font-family:Arial}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px}</style></head><body><div style="text-align:center"><img id="tjmaLogo" style="max-height:90px"><div style="font-size:12px;color:#555">Tribunal de Justiça do Estado do Maranhão</div></div><h2>Memória de Cálculo - ${req.processo}</h2><p>Preset ${req.preset} | Data fim ${req.data_fim} | V_corr = V0 × (índice1/índice0) | Juros simples pro-rata die</p><table><tr><th>Verba</th><th>Corrigido</th><th>Juros</th><th>Total</th></tr>${rows}</table><h3>Total geral R$ ${res.total.toFixed(2)} (base R$ ${res.base.toFixed(2)} + honorários R$ ${res.honorarios.toFixed(2)} + custas R$ ${(res.custas||0).toFixed(2)} + multa R$ ${(res.multa||0).toFixed(2)}) — cálculo id ${res.id}</h3><script>window.print()<\/script></body></html>`);
  w.document.getElementById("tjmaLogo").src=TJMA_LOGO;
  w.document.close();
}
function exportCSV(){
  if(!lastResult){return;}
  const {res} = lastResult;
  const lines = ['verba;corrigido;juros;total', ...res.verbas.map(v=>`${v.nome};${v.corrigido.toFixed(2)};${v.juros.toFixed(2)};${v.total.toFixed(2)}`), `SUBTOTAL;${res.base.toFixed(2)};;;${res.base.toFixed(2)}`, `HONORARIOS;;;;${res.honorarios.toFixed(2)}`, `CUSTAS;;;;${(res.custas||0).toFixed(2)}`, `MULTA;;;;${(res.multa||0).toFixed(2)}`, `TOTAL GERAL;;;;${res.total.toFixed(2)}`];
  const blob = new Blob(["\uFEFF"+lines.join('\n'),], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `memoria_${res.id}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function novaSimulacao(){
  lastResult = null;
  document.getElementById('res').style.display='block' === 'none' ? 'block' : 'none';
  document.getElementById('res').style.display='none';
  document.getElementById('tbody').innerHTML='';
  document.getElementById('erro').textContent='';
  document.getElementById('s3').className=''; document.getElementById('s4').className='';
  window.scrollTo(0,0);
}
presets(); addVerba('Dano moral',20000,'2023-06-15'); addVerba('Dano material',8450,'2020-01-10');
</script>
